<style>
:root{
  --bg:#0A0B0A; --panel:#161A18; --panel2:#1D2320; --line:#2C332F;
  --text:#ECE8DE; --dim:#9CA39D; --accent:#E5402A; --accent2:#D9A441; --good:#5FA777;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{padding-bottom:64px;}
h1,h2,h3{font-weight:700;margin:0;color:var(--text);}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;-webkit-appearance:none;appearance:none;text-align:inherit;font-size:inherit;}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px;}
textarea,input,select{font-family:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;font-size:14px;}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px;letter-spacing:.02em;}
.field{margin-bottom:6px;}
.hint{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.5;}
.ghost{font-family:var(--mono);font-size:11px;color:#5A625E;background:#0E100F;border:1px dashed var(--line);border-radius:6px;padding:6px 8px;margin-top:4px;white-space:pre-wrap;}

/* Header */
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.brand{display:flex;flex-direction:column;line-height:1.15;}
.brand b{letter-spacing:.14em;font-size:15px;}
.brand span{font-size:10.5px;color:var(--dim);}
.tabs{margin-left:auto;display:flex;gap:6px;}
.tabbtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:6px 14px;font-size:12.5px;}
.tabbtn.active{background:var(--panel2);color:var(--text);border-color:#3a413d;}

/* Step rail */
.railwrap{overflow-x:auto;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:53px;z-index:19;}
.rail{display:flex;gap:2px;padding:8px 12px;min-width:max-content;}
.railitem{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;font-size:12.5px;color:var(--dim);white-space:nowrap;border:1px solid transparent;transition:border-color .15s;}
.railitem:hover{border-color:var(--line);}
.railitem b{font-family:var(--mono);color:#565F5C;font-size:11px;}
.railitem.active{background:var(--panel);color:var(--text);border-color:var(--line);}
.railitem.active b{color:var(--accent2);}
.railitem.done b{color:var(--good);}

main{padding:16px;max-width:760px;margin:0 auto;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;}
.cardhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.cardhead .n{font-family:var(--mono);color:var(--accent2);font-size:12px;}
.cardhead h3{font-size:15px;}
.subtle{color:var(--dim);font-size:12.5px;margin-bottom:12px;line-height:1.6;}

/* Mode & preset cards */
.grid2{display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}
.modecard{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px 14px;text-align:left;color:var(--text);transition:border-color .15s;}
.modecard:hover{border-color:#3a413d;}
.modecard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.modecard b{display:block;font-size:14.5px;margin-bottom:2px;color:var(--text);}
.modecard .en{font-family:var(--mono);font-size:10.5px;color:var(--dim);}
.modecard p{font-size:12px;color:var(--dim);margin:6px 0 8px;line-height:1.5;}
.chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{font-size:10.5px;background:#0E100F;border:1px solid var(--line);border-radius:20px;padding:2px 8px;color:var(--dim);}

.presetcard{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.presetcard div{flex:1;}
.presetcard b{font-size:13px;}
.presetcard p{font-size:11.5px;color:var(--dim);margin:3px 0 0;line-height:1.5;}
.smallbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 12px;font-size:12px;white-space:nowrap;}
.smallbtn:hover{border-color:var(--accent2);}
.smallbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ref rows */
.refrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel2);}
.refrow .rowhead{display:flex;justify-content:space-between;align-items:center;}
.rmbtn{background:transparent;border:none;color:var(--dim);font-size:16px;line-height:1;}
.rmbtn:hover{color:var(--accent);}

/* camera picker */
.movegrid{display:grid;grid-template-columns:1fr;gap:6px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2);}
@media(min-width:640px){.movegrid{grid-template-columns:1fr 1fr;}}
.movebtn{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 9px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);font-size:12.5px;}
.movebtn:hover{background:#1B201D;}
.movebtn.sel{background:#1D1210;border-color:var(--accent);}
.catdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.beatblock{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--panel2);}
.timeline{display:flex;gap:2px;border-radius:7px;overflow:hidden;height:52px;margin:2px 0 14px;border:1px solid var(--line);}
.tlseg{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:5px 7px;min-width:34px;overflow:hidden;transition:filter .15s;}
.tlseg:hover{filter:brightness(1.15);}
.tlseg .tllabel{font-size:9.5px;font-weight:700;color:rgba(10,11,10,.82);text-shadow:0 1px 0 rgba(255,255,255,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tlseg .tlrange{font-family:var(--mono);font-size:8.5px;color:rgba(10,11,10,.62);white-space:nowrap;}
.tlseg.empty{background:repeating-linear-gradient(45deg,#1B201D,#1B201D 5px,#161A18 5px,#161A18 10px);}
.tlseg.empty .tllabel{color:var(--dim);text-shadow:none;}
.tlseg.empty .tlrange{color:#565F5C;}
.tllegend{display:flex;flex-wrap:wrap;gap:10px;margin:-6px 0 14px;}
.tllegend span{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);}
.tllegend i{width:7px;height:7px;border-radius:50%;display:inline-block;}
.timeline.single-mode{border:none;height:auto;overflow:visible;}
.tlbar{position:relative;display:flex;height:44px;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
.tlbarlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:rgba(10,11,10,.85);text-shadow:0 1px 0 rgba(255,255,255,.18);pointer-events:none;}
.tlticks{display:flex;margin-top:4px;}
.tlticks span{flex-shrink:0;font-family:var(--mono);font-size:9px;color:#565F5C;text-align:left;}
.beatblock .rangehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.beatblock .rangehead b{font-family:var(--mono);font-size:12px;color:var(--accent2);}
.warn{background:#241511;border:1px solid #5A2E20;color:#F0B199;border-radius:6px;padding:7px 9px;font-size:11.5px;margin-top:6px;line-height:1.5;}
.ok{background:#0F1D14;border:1px solid #24422E;color:#9BD3AC;border-radius:6px;padding:7px 9px;font-size:11.5px;margin-top:6px;line-height:1.5;}

.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;}
.navbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 18px;font-size:13.5px;flex:1;transition:border-color .15s;}
.navbtn:hover{border-color:#3a413d;}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.navbtn:disabled{opacity:.35;}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 14px;z-index:30;}
.meter{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:1;}
.meter b{color:var(--text);}
.bottombtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 16px;font-size:12.5px;}
.bottombtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.saveind{font-size:10.5px;color:var(--dim);white-space:nowrap;}
.saveind.ok{color:var(--good);}
.saveind.off{color:var(--accent2);}

.restorebar{display:none;align-items:center;gap:10px;justify-content:space-between;background:#1D2320;border-bottom:1px solid var(--line);padding:10px 14px;font-size:12.5px;color:var(--text);flex-wrap:wrap;}
.restorebar.show{display:flex;}
.restorebar .restorebtns{display:flex;gap:6px;flex-shrink:0;}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;}
.overlay.open{display:block;}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:85vh;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:41;transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
.drawer.open{transform:translateY(0);}
.drawerhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);}
.drawerbody{overflow-y:auto;padding:14px 16px;}
.drawertabs{display:flex;gap:6px;padding:0 16px;margin-top:10px;}
.dtab{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:16px;padding:5px 12px;font-size:11.5px;}
.dtab.active{background:var(--panel2);color:var(--text);}
pre.promptbox{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.7;background:#0E100F;border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;}
.vitem{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:6px 0;border-bottom:1px solid #1c211f;}
.vitem:last-child{border-bottom:none;}
.vitem .ic{flex-shrink:0;width:16px;text-align:center;}

/* repair tab */
.failcard{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.failcard b{font-size:13.5px;display:block;}
.failcard p{font-size:11.5px;color:var(--dim);margin:4px 0 0;}
.failcard .detail{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--text);line-height:1.6;}
.failcard.open .detail{display:block;}

.emptynote{font-size:12px;color:var(--dim);text-align:center;padding:24px 10px;border:1px dashed var(--line);border-radius:9px;}

.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:9px;font-weight:700;margin-left:5px;cursor:help;vertical-align:middle;flex-shrink:0;}
.tip:hover, .tip:focus{color:var(--accent2);border-color:var(--accent2);}
.tip:hover .tipbubble, .tip:focus .tipbubble{opacity:1;visibility:visible;transform:translate(-50%,-2px);}
.tipbubble{position:absolute;left:50%;bottom:130%;transform:translate(-50%,0);background:#0E100F;border:1px solid var(--line);color:var(--text);font-size:11.5px;font-weight:400;line-height:1.55;padding:9px 11px;border-radius:7px;width:min(220px, 62vw);opacity:0;visibility:hidden;transition:opacity .12s,transform .12s;z-index:50;pointer-events:none;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.45);}
.cardhead .tip{margin-left:auto;}
.cardhead .tip .tipbubble{left:auto;right:0;}
.cardhead .tip:hover .tipbubble, .cardhead .tip:focus .tipbubble{transform:translate(0,-2px);}
label .tip{margin-left:6px;}

/* manual tab */
.manual h4{font-size:14px;color:var(--accent2);margin:0 0 6px;}
.manual p, .manual li{font-size:12.5px;color:var(--text);line-height:1.7;}
.manual ul{margin:4px 0 0;padding-left:18px;}
.manual .msec{margin-bottom:18px;}
.manual .mnote{background:#0E100F;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--dim);margin-top:8px;line-height:1.6;}

@media (prefers-reduced-motion: reduce){
  .dot{animation:none;}
  .drawer{transition:none;}
  .modecard, .navbtn, .railitem, .smallbtn, .tlseg{transition:none;}
}
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <div class="brand"><b>SLATE</b><span>Seedance 2.5 프롬프트 컴파일러 · v1.5.4</span></div>
  <div class="tabs">
    <button class="tabbtn" id="tab-builder" onclick="setTab('builder')">빌더</button>
    <button class="tabbtn" id="tab-repair" onclick="setTab('repair')">리페어</button>
  </div>
</header>

<div class="restorebar" id="restorebar">
  <span id="restoretext">이전 작업이 저장되어 있습니다.</span>
  <div class="restorebtns">
    <button class="smallbtn primary" onclick="restoreDraft()">이어서 작업하기</button>
    <button class="smallbtn" onclick="dismissDraft()">새로 시작</button>
  </div>
</div>

<div class="railwrap" id="railwrap"><div class="rail" id="rail"></div></div>

<main id="main"></main>

<div class="bottombar">
  <div class="meter" id="meter">0자</div>
  <span class="saveind" id="saveind"></span>
  <button class="bottombtn" onclick="openDrawer('preview')">미리보기</button>
  <button class="bottombtn primary" onclick="openDrawer('validate')">검증</button>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawerhead">
    <b id="drawertitle">미리보기</b>
    <button class="rmbtn" onclick="closeDrawer()" style="font-size:22px;">✕</button>
  </div>
  <div class="drawertabs">
    <button class="dtab" id="dtab-preview" onclick="setDrawerTab('preview')">프롬프트</button>
    <button class="dtab" id="dtab-validate" onclick="setDrawerTab('validate')">검증</button>
  </div>
  <div class="drawerbody" id="drawerbody"></div>
</div>

<script>
/* ==================== DATA ==================== */
// 카메라 무브 30종 + 모드 정의 데이터 (camera-motion.md, prompt-patterns.md 기반)
const CATS = {
  trans: { label: "이동(Translation)", color: "#5B8FB0" },
  rot:   { label: "회전(Rotation)",    color: "#9B87C4" },
  lens:  { label: "렌즈/포커스",        color: "#D9A441" },
  rig:   { label: "리그/오퍼레이터",     color: "#5FA777" },
  cut:   { label: "전환/편집점",        color: "#E5402A" },
};

const CAMERA_MOVES = [
  { id:"dolly_in", cat:"trans", en:"Push / dolly in", note:"카메라 본체가 피사체 쪽으로 전진, 전경·배경 패럴랙스 증가",
    req:["Start framing","Target","Forward path","Speed profile","End framing"],
    compat:"랙 포커스, 절제된 핸드헬드, 별도로 지정된 팬/틸트", conflicts:"고정샷(locked-off); 동시 줌인 지정 없이 혼용",
    phrase:"Medium shot; physical dolly in along the table toward the actor, restrained acceleration, actor stays center-frame, foreground parallax increases, end in close-up." },
  { id:"dolly_out", cat:"trans", en:"Pull / dolly out", note:"카메라 본체가 후진, 공간 깊이와 패럴랙스가 드러남",
    req:["Start framing","Retreat path","Subject relation","Reveal","End framing"],
    compat:"크레인 다운, 랙 포커스, 안정된 이후 디졸브", conflicts:"고정샷; 동시 줌아웃 지정 없이 혼용",
    phrase:"Close-up to wide: physical dolly out from the actor, maintain center framing, reveal the doorway and room depth, settle before the cut." },
  { id:"truck_left", cat:"trans", en:"Truck left", note:"카메라 본체가 좌측으로 수평 이동(팬이 아님)",
    req:["Start framing","Lateral direction","Path clearance","Pan target (if any)","End framing"],
    compat:"지정 타겟으로의 팬, 사이드 트래킹, 짐벌", conflicts:"고정샷; 이동인데 '팬 레프트'라고만 표기",
    phrase:"Truck camera left along the storefront, keep the walker on the right third, pan gently to retain the face, finish aligned with the door." },
  { id:"truck_right", cat:"trans", en:"Truck right", note:"카메라 본체가 우측으로 수평 이동(팬이 아님)",
    req:["Start framing","Lateral direction","Path clearance","Pan target (if any)","End framing"],
    compat:"지정 타겟으로의 팬, 사이드 트래킹, 짐벌", conflicts:"고정샷; 이동인데 '팬 라이트'라고만 표기",
    phrase:"Truck camera right beside the counter, maintain the chef in profile, leave clearance from the stools, settle on the plated dish." },
  { id:"pedestal_up", cat:"trans", en:"Pedestal up", note:"카메라 본체가 수직 상승, 조준(에임)은 독립적일 수 있음",
    req:["Start height/framing","Upward path","Aim behavior","Subject blocking","End framing"],
    compat:"틸트, 짐벌, 리드 트래킹", conflicts:"고정샷; 높이 변화를 틸트라고 잘못 지칭",
    phrase:"Pedestal up from table height to eye level, keep the seated actor centered with a gentle independent tilt, end in a clean medium shot." },
  { id:"pedestal_down", cat:"trans", en:"Pedestal down", note:"카메라 본체가 수직 하강, 조준은 독립적일 수 있음",
    req:["Start height/framing","Downward path","Aim behavior","Ground clearance","End framing"],
    compat:"틸트, 짐벌, 랙 포커스", conflicts:"고정샷; 높이 변화를 틸트라고 잘못 지칭",
    phrase:"Pedestal down from eye level to the child's level, retain the face near center, end with the toy foreground visible." },
  { id:"crane_boom", cat:"trans", en:"Crane / boom", note:"지지대에 실린 카메라가 넓은 수직·대각 궤적 이동(상승·하강·리치 결합 가능)",

];
function conflictLookup(idA, idB){
  if(!idA || !idB || idA===idB) return null;
  const hit = CONFLICT_PAIRS.find(p => (p.a===idA&&p.b===idB) || (p.a===idB&&p.b===idA));
  if(hit) return hit;
  // 매트릭스에 없는 조합은 각 무브 자체의 conflicts 텍스트로 휴리스틱 대조
  const mvA = moveById(idA), mvB = moveById(idB);
  const aFlag = mvA.conflicts.includes(mvB.en.split(" ")[0]) || mvA.conflicts.toLowerCase().includes(mvB.cat);
  if(aFlag) return { verdict:"ambiguous", note:"매트릭스에 없는 조합입니다. "+mvA.en+"의 충돌 메모: "+mvA.conflicts };
  return { verdict:"compatible", note:"매트릭스·개별 무브 메모 어디에도 명시적 충돌이 없습니다. 그래도 두 동작을 별도 절로 명확히 구분해서 쓰세요." };
}

  const titles = ["모드 · 프리셋","딜리버러블",
    (m==="r2v"||m==="edit"||m==="ext") ? "레퍼런스 태그" : "레퍼런스 롤맵",
    m==="r2v" ? "화이트모델 경로" : m==="edit" ? "수정 규칙" : m==="ext" ? "핸드오프 · 연속성" : "논네고 · 씬규칙",
    m==="r2v" ? "배우 동작" : m==="edit" ? "수정 구간 액션" : "서브젝트 · 카메라",
    "라이팅 · 오디오","최종프레임 · 연속성"];
  return titles[i];
}

/* ==================== REF ROWS ==================== */
function addRef(){ S.refs.push({tag:"", role:"", note:""}); render(); }
function removeRef(i){ S.refs.splice(i,1); render(); }

/* ==================== BEATS ==================== */
function addBeat(){ S.beats.push({range:"", action:"", moveId:null, clause:"", secondaryMoveId:null, secondaryClause:""}); render(); }
function removeBeat(i){ S.beats.splice(i,1); render(); }

/* ==================== CAMERA MOVE SELECT ==================== */
function parseDur(range){
  if(!range) return null;
  const m = String(range).match(/(\d+(?:\.\d+)?)\s*[–\-~]\s*(\d+(?:\.\d+)?)/);
  if(m){ const a=parseFloat(m[1]), b=parseFloat(m[2]); if(b>a) return b-a; }
  return null;
}
function renderTimeline(){
  if(!S.beats.length) return "";
  const single = S.mode==="short" || S.mode==="i2v" || S.mode==="ext";
  const durs = S.beats.map(b=>parseDur(b.range)||4);

  if(single){
    const mv = S.camMoveId ? moveById(S.camMoveId) : null;
    const bg = mv ? CATS[mv.cat].color : null;
    const label = mv ? mv.en : "카메라 무브 미선택";
    const segs = S.beats.map((b,i)=>{
      const lastBorder = i<S.beats.length-1 ? "border-right:1px solid rgba(0,0,0,.28);" : "";
      return `<div class="tlseg ${mv?"":"empty"}" style="flex:${durs[i]} 0 0;${bg?`background:${bg};`:""}${lastBorder}" title="${esc(b.range)}"></div>`;
    }).join("");
    const ticks = S.beats.map((b,i)=>`<span style="flex:${durs[i]} 0 0;">${esc(b.range)}</span>`).join("");
    const legend = mv ? `<div class="tllegend"><span><i style="background:${CATS[mv.cat].color}"></i>${CATS[mv.cat].label}</span></div>` : "";
    const labelStyle = mv ? "" : `style="color:var(--dim);text-shadow:none;"`;
    return `<div class="timeline single-mode"><div class="tlbar">${segs}<div class="tlbarlabel" ${labelStyle}>${esc(label)}</div></div></div>
      <div class="tlticks">${ticks}</div>
      <div class="hint" style="margin:6px 0 12px;">이 카메라 무브 하나가 위 서브젝트 비트 전체에 걸쳐 적용됩니다(원테이크 원칙 — 비트마다 카메라를 따로 정하지 않습니다). 비트별로 다른 카메라를 쓰고 싶다면 '30초 시퀀스' 모드를 사용하세요.</div>
      ${legend}`;
  }

  const usedCats = new Set();
  const segs = S.beats.map((b,i)=>{
    const mv = b.moveId?moveById(b.moveId):null;
    if(mv) usedCats.add(mv.cat);
    const label = mv ? mv.en : "무브 미선택";
    const cls = mv ? "" : "empty";
    const bg = mv ? `background:${CATS[mv.cat].color};` : "";
    return `<div class="tlseg ${cls}" style="flex:${durs[i]} 0 0;${bg}" title="${esc(b.range)} · ${esc(label)}">
      <span class="tllabel">${esc(label)}</span>
      <span class="tlrange">${esc(b.range)}</span>
    </div>`;
  }).join("");
  const legend = Object.keys(CATS).filter(k=>usedCats.has(k)).map(k=>`<span><i style="background:${CATS[k].color}"></i>${CATS[k].label}</span>`).join("");
  return `<div class="timeline">${segs}</div>${legend?`<div class="tllegend">${legend}</div>`:""}
    <div class="hint" style="margin:-8px 0 12px;">비트마다 서로 다른 카메라 무브를 하나씩(primary) 고를 수 있습니다.</div>`;
}
function scaffoldFor(move){
  let lines = [move.req.map(f=>f+": ").join("\n")];
  return lines.join("\n");
}
function selectMove(beatIndex, moveId){
  const move = moveById(moveId);
  if(beatIndex===null){
    if(S.camMoveId===moveId) return; // 이미 선택된 무브를 다시 클릭 — 편집 중인 클로즈를 건드리지 않음
    if(S.camClause && S.camClause.trim()){
      if(!confirm("현재 카메라 클로즈 내용을 '"+move.en+"' 스캐폴드로 덮어쓸까요? 취소하면 아무것도 바뀌지 않습니다.")) return;
    }
    S.camMoveId = moveId;
    S.camClause = scaffoldFor(move);
    if(S.camSecondaryId===moveId){ S.camSecondaryId=null; S.camSecondaryClause=""; }
  } else {
    const b = S.beats[beatIndex];
    if(b.moveId===moveId) return;
    if(b.clause && b.clause.trim()){
      if(!confirm("이 비트의 카메라 클로즈 내용을 '"+move.en+"' 스캐폴드로 덮어쓸까요? 취소하면 아무것도 바뀌지 않습니다.")) return;
    }
    b.moveId = moveId;
    b.clause = scaffoldFor(move);
    if(b.secondaryMoveId===moveId){ b.secondaryMoveId=null; b.secondaryClause=""; }
  }
  render();
}

/* ==================== ASSEMBLE ==================== */
function v(val, ph){ return (val && String(val).trim()) ? val : "["+ph+"]"; }
function vp(val, ph){ return v(val, ph).trim().replace(/[.。]+$/, ""); }
function opt(val){ return (val && String(val).trim()) ? String(val).trim() : ""; }
function camClauseFull(){
  let c = v(S.camClause,"카메라 무브 미선택").trim();
  if(S.camSecondaryId && opt(S.camSecondaryClause)){
    c += " Secondary move (" + moveById(S.camSecondaryId).en + "): " + opt(S.camSecondaryClause);
  }
  return c;
}
function beatClauseFull(b){
  let c = b.clause ? b.clause.replace(/\n/g," ") : "[무브 미선택]";
  if(b.secondaryMoveId && opt(b.secondaryClause)){
    c += " | Secondary (" + moveById(b.secondaryMoveId).en + "): " + opt(b.secondaryClause);
  }
  return c;
}
function audioLabel(k){
  return {clean:"Clean visual (no incidental sound)", diegetic:"Diegetic sound only", scored:"Scored soundtrack", source:"Source-audio transfer (Beta/UI-dependent)"}[k] || k;
}
function refsLine(){
  if(!S.refs.length) return "[레퍼런스 없음]";
  return S.refs.filter(r=>r.tag).map(r=>`${r.tag} — ${v(r.role,"역할 미지정")}${r.note? "; "+r.note:""}`).join(". ");
}
function beatsActionLine(){
  return S.beats.map(b=>`${v(b.range,"구간")}, ${v(b.action,"액션 미지정")}`).join(" ");
}

function assemble(){
  const m = S.mode;
  if(!m) return "왼쪽에서 모드를 먼저 선택하세요.";
  const lines = [];
  if(m==="short"){
    lines.push(`Mode/output: Standard text-to-video, one continuous shot, ${v(S.duration,"DURATION")}. ${S.aspectOutput?("Output: "+S.aspectOutput+"."):""} ${S.fastProfile?"Seedance 2.0 Fast custom profile.":""}`);
    lines.push(`Reference-role map: ${refsLine()}`);
    lines.push(`Non-negotiables: ${v(S.nonNegotiables,"비어있음")}`);
    lines.push(`Scene/spatial rules: ${v(S.sceneRules,"비어있음")}`);
    lines.push(`Timestamped subject action: ${beatsActionLine()}`);
    lines.push(`Camera plan: purpose: ${vp(S.camPurpose,"목적 미지정")}. ${camClauseFull()} Continuity/edit: one contiguous physical path; no cut.`);
    lines.push(`Lighting/style: ${v(S.lighting,"비어있음")}`);
    lines.push(`Audio mode: ${audioLabel(S.audioMode)}; ${v(S.audioDetail,"세부 미지정")}`);
    lines.push(`End state: ${v(S.finalFrame,"비어있음")}`);
    lines.push(`Continuity locks: ${v(S.continuityLocks,"비어있음")}`);
  } else if(m==="seq30"){
    lines.push(`Mode/output: Standard 30-second continuous text-to-video sequence, one continuous shot. ${S.aspectOutput?("Output: "+S.aspectOutput+"."):""}`);
    lines.push(`Reference-role map: ${refsLine()}`);
    lines.push(`Non-negotiables: ${v(S.nonNegotiables,"비어있음")}`);
    lines.push(`Scene/spatial rules: ${v(S.sceneRules,"비어있음")}`);
    lines.push(`Timestamped subject action: ` + S.beats.map(b=>`${v(b.range,"구간")} ${b.label?("("+b.label+")"):""} — ${v(b.action,"액션 미지정")}`).join(" "));
    lines.push(`Camera plan: purpose: ${vp(S.camPurpose,"목적 미지정")}. Primary move by beat: ` +
      S.beats.map(b=>`${v(b.range,"구간")} ${beatClauseFull(b)}`).join(" | ") +
      ` Continuity/edit: physically contiguous route; one continuous shot; no cuts.`);
    lines.push(`Lighting/style: ${v(S.lighting,"비어있음")}, continuous across all beats.`);
    lines.push(`Audio mode: ${audioLabel(S.audioMode)}; ${v(S.audioDetail,"세부 미지정")}`);
    lines.push(`End state: ${v(S.finalFrame,"비어있음")}`);
    lines.push(`Continuity locks: ${v(S.continuityLocks,"비어있음")}`);
  } else if(m==="i2v"){
    lines.push(`Mode/output: Image-to-video, ${v(S.duration,"DURATION")}, one continuous shot. ${S.aspectOutput?("Output: "+S.aspectOutput+"."):""} ${S.fastProfile?"Seedance 2.0 Fast custom profile.":""}`);
    lines.push(`Reference-role map: ${refsLine()}`);
    lines.push(`Non-negotiables: begin from the opening image's visible composition; ${v(S.nonNegotiables,"비어있음")}`);
    lines.push(`Scene/spatial rules: extend only what is implied by the opening image; ${v(S.sceneRules,"비어있음")}`);
    lines.push(`Timestamped subject action: ${beatsActionLine()}`);
    lines.push(`Camera plan: purpose: ${vp(S.camPurpose,"목적 미지정")}. Start framing: match the opening image. ${camClauseFull()} Continuity/edit: evolve directly from the opening image; no cuts.`);
    lines.push(`Lighting/style: continue the opening image's lighting/style; ${v(S.lighting,"비어있음")}`);
    lines.push(`Audio mode: ${audioLabel(S.audioMode)}; ${v(S.audioDetail,"세부 미지정")}`);
    lines.push(`End state: ${v(S.finalFrame,"비어있음")}`);
    lines.push(`Continuity locks: do not replace identity, wardrobe, key props, or initial lighting from the opening image. ${opt(S.continuityLocks)}`);
  } else if(m==="ext"){
    const e = S.ext;
    lines.push(`Mode/output: Extension of ${v(e.prevTag,"PREVIOUS_CLIP_TAG")}, add ${v(e.newDuration,"DURATION")} using the previous final frame as the continuity target. ${S.fastProfile?"Seedance 2.0 Fast custom profile.":""}`);
    lines.push(`Reference-role map: ${v(e.prevTag,"PREVIOUS_CLIP_TAG")} is the handoff image/identity/composition/motion/audio source, highest priority; ${v(e.identityTag,"IDENTITY_TAG")} verifies identity only; ${v(e.newActionTag,"NEW_ACTION_TAG")} supplies ${v(e.newActionScope,"신규 액션 범위")} only.`);
    lines.push(`Non-negotiables: direct the first frame to match this handoff state as closely as the active interface permits: ${v(e.prevFinalFrame,"직전 최종 프레임 미지정")}. ${opt(S.nonNegotiables)}`);
    lines.push(`Scene/spatial rules: continue from ${v(e.location,"직전 위치·지오메트리")}; travel direction ${v(e.travelDir,"미지정")}; clearance ${v(e.clearance,"미지정")}. ${opt(S.sceneRules)}`);
    lines.push(`Timestamped subject action: 0–${v(e.handoffSettle,"HANDOFF")}s, hold/continue the previous final pose and motion. ${beatsActionLine()}`);
    lines.push(`Camera plan: purpose: ${vp(S.camPurpose,"목적 미지정")}. Start framing: match the previous final framing as closely as possible. ${camClauseFull()} Continuity/edit: aim for a visually seamless extension boundary at frame 0; no reset, teleport, or new cut.`);
    lines.push(`Lighting/style: continue previous lighting/style; ${opt(S.lighting)}`);
    lines.push(`Audio mode: continue previous audio mode; ${audioLabel(S.audioMode)}; ${opt(S.audioDetail)}`);
    lines.push(`End state: ${v(S.finalFrame,"비어있음")}`);
    lines.push(`Continuity locks: preserve the previous clip's identity, composition, camera height/direction, lighting, sound bed, and motion direction through the handoff. ${opt(S.continuityLocks)}`);
  } else if(m==="r2v"){
    const r = S.r2v;
    lines.push(`Mode/output: R2V with white-model/previs camera-path reference, ${v(S.duration,"DURATION")}, one continuous shot. ${S.aspectOutput?("Output: "+S.aspectOutput+"."):""} ${S.fastProfile?"Seedance 2.0 Fast custom profile.":""}`);
    lines.push(`Reference-role map: ${v(r.identityTag,"IDENTITY_TAG")} is identity/style, highest priority. ${v(r.actorTag,"ACTOR_TAG")} is actor motion and interaction only. ${v(r.cameraPathTag,"CAMERA_PATH_TAG")} is a white-model/previs reference for camera geometry and path only. ${r.styleTag? r.styleTag+" may affect palette/materials only.":""}`);
    lines.push(`Non-negotiables: preserve ${v(r.identityTag,"IDENTITY_TAG")}; do not inherit camera shake or appearance from ${v(r.actorTag,"ACTOR_TAG")}; do not inherit white-model materials, people, or lighting from ${v(r.cameraPathTag,"CAMERA_PATH_TAG")}. ${opt(S.nonNegotiables)}`);
    lines.push(`Scene/spatial rules: source role: ${v(r.cameraPathTag,"CAMERA_PATH_TAG")} is white-model/previs. Geometry to preserve: ${v(r.geometryAnchors,"지오메트리 미지정")}. Path to preserve: ${v(r.camStart,"시작 상태")} → ${v(r.pathLandmarks,"경로/방향")} → ${v(r.camEnd,"종료 상태")}. Allowable visual replacement: ${v(r.replacement,"미지정")}. Collision handling: ${v(r.collision,"미지정")}. Final framing: ${v(r.finalFraming,"미지정")}.`);
    lines.push(`Timestamped subject action: ${v(r.actorTimestamps,"타임스탬프 미지정")}; actor motion is governed by ${v(r.actorTag,"ACTOR_TAG")}, not by the camera-path source.`);
    lines.push(`Lighting/style: ${v(S.lighting,"비어있음")}, replacing only the permitted white-model appearance.`);
    lines.push(`Audio mode: ${audioLabel(S.audioMode)}; ${v(S.audioDetail,"세부 미지정")}`);
    lines.push(`End state: ${v(S.finalFrame,"비어있음")}`);
    lines.push(`Continuity locks: preserve the named geometry, ${v(r.identityTag,"IDENTITY_TAG")}, actor route, camera route. ${opt(S.continuityLocks)}`);
  } else if(m==="edit"){
    const e = S.edit;
    lines.push(`Mode/output: Localized edit of ${v(e.sourceTag,"SOURCE_CLIP_TAG")}, region ${v(e.editRegion,"EDIT_REGION")}, changing only ${v(e.editVariable,"EDIT_VARIABLE")}.`);
    lines.push(`Reference-role map: ${v(e.sourceTag,"SOURCE_CLIP_TAG")} is the immutable source for all unaffected content, highest priority; ${v(e.identityTag,"IDENTITY_TAG")} verifies identity only; ${v(e.editRefTag,"EDIT_REFERENCE_TAG")} supplies ${v(e.editVariable,"EDIT_VARIABLE")} only.`);
    lines.push(`Non-negotiables: alter only ${v(e.editRegion,"EDIT_REGION")}/${v(e.editVariable,"EDIT_VARIABLE")}; preserve all unaffected motion, timing, composition, lighting, audio, and identity as a continuity goal; retain ${v(e.sourceTag,"SOURCE_CLIP_TAG")}'s duration and output framing, then inspect for drift.`);
    lines.push(`Scene/spatial rules: ${v(e.editRegion,"EDIT_REGION")} stays attached to ${v(e.spatialAnchor,"SPATIAL_ANCHOR")}; retain the source geometry, occlusion order, and clearance.`);
    lines.push(`Timestamped subject action: ${v(e.editStart,"START")}–${v(e.editEnd,"END")}, change ${v(e.editVariable,"EDIT_VARIABLE")} from ${v(e.sourceValue,"SOURCE_VALUE")} to ${v(e.targetValue,"TARGET_VALUE")}; all other subject actions keep their source timing and motion.`);
    lines.push(`Camera plan: purpose: preserve the source shot. Retain source camera move, path, speed profile, and blocking outside ${v(e.editRegion,"EDIT_REGION")}. Continuity/edit: localized edit boundary is ${v(e.editRegion,"EDIT_REGION")} only; no global reframe or added cut.`);
    lines.push(`Lighting/style: retain source lighting/style outside ${v(e.editRegion,"EDIT_REGION")}; match any changed pixels to source lighting. ${opt(S.lighting)}`);
    lines.push(`Audio mode: preserve source audio unchanged, including timing and mix. ${opt(S.audioDetail)}`);
    lines.push(`End state: source-equivalent frame with only ${v(e.editVariable,"EDIT_VARIABLE")} changed to ${v(e.targetValue,"TARGET_VALUE")}: ${v(S.finalFrame,"비어있음")}`);
    lines.push(`Continuity locks: unaffected motion, timing, composition, lighting, audio, identity, camera behavior, and all regions outside ${v(e.editRegion,"EDIT_REGION")} remain locked. ${opt(S.continuityLocks)}`);
  }
  return lines.map(l=>l.replace(/[ \t]{2,}/g," ").replace(/\s+$/,"")).join("\n\n");
}

/* ==================== VALIDATE ==================== */
function validate(){
  const m = S.mode; const items = [];
  const push = (ok, text) => items.push({ok, text});
  if(!m){ push(false, "모드를 먼저 선택하세요."); return items; }
  const dur = m==="ext" ? S.ext.newDuration : S.duration;
  push(!!dur, "길이(duration)가 선언되었습니다.");
  push(!!S.aspectOutput || m==="edit", "출력 의도(aspect/format)가 선언되었습니다.");
  if(m==="r2v"){
    push(!!(S.r2v.identityTag && S.r2v.actorTag && S.r2v.cameraPathTag), "정체성·배우·카메라경로 태그의 역할이 모두 지정되었습니다.");
    push(!!(S.r2v.camStart && S.r2v.pathLandmarks && S.r2v.camEnd), "화이트모델 경로의 시작-경로-종료 상태가 모두 채워졌습니다.");
  } else if(m==="edit"){
    push(!!(S.edit.sourceTag && S.edit.editRegion && S.edit.editVariable), "소스 클립·수정 구간·수정 변수가 모두 지정되었습니다.");
  } else if(m==="ext"){
    push(!!(S.ext.prevTag && S.ext.identityTag && S.ext.newActionTag), "직전 클립·정체성·신규 액션 태그가 모두 지정되었습니다.");
    push(!!S.ext.prevFinalFrame, "직전 클립의 최종 프레임(핸드오프 타겟)이 서술되었습니다.");
    push(S.refs.every(r=>r.tag && r.role), "모든 레퍼런스 자산에 역할이 지정되었습니다.");
    push(S.beats.every(b=>b.action && b.action.trim()), "모든 비트에 서브젝트 액션이 채워졌습니다(카메라와 분리).");
    push(!!S.camMoveId, "카메라 무브가 선택되었습니다.");
  } else {
    push(S.refs.every(r=>r.tag && r.role), "모든 레퍼런스 자산에 역할이 지정되었습니다.");
    push(S.beats.every(b=>b.action && b.action.trim()), "모든 비트에 서브젝트 액션이 채워졌습니다(카메라와 분리).");
    if(m==="seq30"){
      push(S.beats.every(b=>b.moveId), "모든 비트에 카메라 무브가 하나씩(primary) 선택되었습니다.");
    } else {
      push(!!S.camMoveId, "카메라 무브가 선택되었습니다.");
    }
  }
  push(!!S.audioMode, "오디오 모드가 명시적으로 선택되었습니다.");
  push(!!S.finalFrame, "최종 프레임(핸드오프 상태)이 서술되었습니다.");

  // beta flags
  const durNum = parseInt(dur);
  if(durNum && durNum>30) push(null, "30초를 초과하는 길이는 Beta/UI-dependent입니다 — 현재 인터페이스에서 노출되는지 확인하세요.");
  if(S.audioMode==="source") push(null, "소스 오디오 전송은 Beta/UI-dependent입니다 — UI가 지원하는지 확인하세요.");

  // one-shot vs cut conflict
  if(m==="seq30"){
    S.beats.forEach((b,i)=>{
      if(b.moveId && catOf(moveById(b.moveId).cat).label.includes("전환")){
        push(null, `비트 ${i+1}(${b.range})의 무브가 편집점(컷) 카테고리입니다 — 이 모드는 컷 없는 원테이크가 기본이므로 의도적인지 확인하세요.`);
      }
    });
  } else if(S.camMoveId){
    const mv = moveById(S.camMoveId);
    if(mv && mv.cat==="cut" && m!=="edit"){
      push(null, "선택한 무브가 편집점(컷) 카테고리입니다 — 이 모드는 컷 없는 원테이크가 기본이므로 의도적인지 확인하세요.");
    }
  }

  // secondary-move conflict summary
  const secPairs = [];
  if(m==="seq30"){
    S.beats.forEach((b,i)=>{ if(b.moveId && b.secondaryMoveId) secPairs.push({label:`비트 ${i+1}(${b.range})`, a:b.moveId, b:b.secondaryMoveId}); });
  } else if(S.camMoveId && S.camSecondaryId){
    secPairs.push({label:"카메라 플랜", a:S.camMoveId, b:S.camSecondaryId});
  }
  secPairs.forEach(p=>{
    const c = conflictLookup(p.a, p.b);
    if(c.verdict==="conflict") push(false, `${p.label}: 주무브·보조무브 조합이 충돌합니다 — ${c.note}`);
    else if(c.verdict!=="compatible") push(null, `${p.label}: 주무브·보조무브 조합에 주의가 필요합니다 — ${c.note}`);
  });
  return items;
}

/* ==================== CHAR BUDGET ==================== */
function charCount(text){ return Array.from(text).length; }
function budgetInfo(){
  const b = S.fastProfile ? BUDGET.fast : BUDGET.full;
  const n = charCount(assemble());
  let color = "var(--dim)", state="여유";
  if(n>=b.hardMax){ color="var(--accent)"; state="상한 초과"; }
  else if(n>=b.softMax){ color="var(--accent2)"; state="상한 근접"; }
  else if(n>=b.softMin){ color="var(--good)"; state="목표 범위"; }
  return {n, color, state, b};
}

function setPathSilent(el, path){
  const parts = path.split(".");
  let obj = S;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = el.value;
  updateMeter();
}

function renderSecondaryPicker(beatIndex, primaryId){
  const target = beatIndex===null ? S : S.beats[beatIndex];
  const secIdActual = beatIndex===null ? S.camSecondaryId : target.secondaryMoveId;
  const secPathClause = beatIndex===null ? "camSecondaryClause" : `beats.${beatIndex}.secondaryClause`;
  const secClauseVal = beatIndex===null ? S.camSecondaryClause : target.secondaryClause;
  let opts = `<option value="">— 보조 무브 없음 —</option>`;
  CAMERA_MOVES.forEach(mv=>{
    if(mv.id===primaryId) return;
    opts += `<option value="${mv.id}" ${secIdActual===mv.id?"selected":""}>${mv.en}</option>`;
  });
  let html = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
    <label style="margin-top:0;">보조 무브(선택 — 같은 비트 안에서 함께 쓸 동작)</label>
    <select onchange="selectSecondary(${beatIndex===null?"null":beatIndex}, this.value)">${opts}</select>`;
  if(secIdActual){
    const conflict = conflictLookup(primaryId, secIdActual);
    const verdictClass = conflict.verdict==="conflict" ? "warn" : conflict.verdict==="compatible" ? "ok" : "warn";
    const verdictLabel = {conflict:"⚠ 충돌", ambiguous:"▲ 모호함 주의", risky:"▲ 위험 조합", redundant:"▲ 중복 가능성", compatible:"✓ 호환"}[conflict.verdict] || conflict.verdict;
    html += `<div class="${verdictClass}"><b>${verdictLabel}</b> — ${conflict.note}</div>`;
    html += `<textarea rows="2" style="margin-top:6px;" oninput="setPathSilent(this,'${secPathClause}')" placeholder="보조 동작을 별도 절로 짧게 서술하세요">${esc(secClauseVal)}</textarea>`;
  }
  html += `</div>`;
  return html;
}
function selectSecondary(beatIndex, moveId){
  const val = moveId || null;

  else { S.beats[beatIndex].secondaryMoveId = val; if(!val) S.beats[beatIndex].secondaryClause=""; }
  render();
}

function renderStep(){
  const i = S.step;
  if(i===0) return renderStepMode();
  if(i===7) return renderManual();
  if(!S.mode) return `<div class="emptynote">먼저 모드를 선택하세요.</div>`;
  if(i===1) return renderStepDeliverable();
  if(i===2) return renderStepRefs();
  if(i===3) return renderStepRulesOrPath();
  if(i===4) return renderStepAction();
  if(i===5) return renderStepLightAudio();
  if(i===6) return renderStepFinal();
  return "";
}
function renderRailItems(){
  let html = "";

    const cls = i===S.step ? "active" : (i<S.step ? "done" : "");

}

  });
  html += `</div><div class="card"><div class="cardhead"><span class="n">TIP</span><h3>충돌 빠른 참고</h3></div>
    <p class="subtle">비트마다 무브 하나만 정하고 나머지는 별도 절로 분리하세요. 고정샷(locked-off)은 오빗·팬·틸트·트럭·페데스탈·크레인·핸드헬드·짐벌드리프트·광학줌 전부와 충돌합니다. 돌리와 광학줌을 같은 목적으로 동시에 쓰지 마세요 — 원근이 바뀌길 원하면 돌리, 초점거리만 바뀌길 원하면 줌입니다.</p></div>`;
  return html;
}
function toggleFail(id){ const el = document.getElementById("fc-"+id); if(el) el.classList.toggle("open"); }

/* ==================== DRAWER ==================== */
function escHtml(s){ return esc(s); }
function renderDrawerBody(){
  if(S.drawerTab==="preview"){
    const text = assemble();
    const info = budgetInfo();
    return `<div class="meter" style="margin-bottom:8px;"><b style="color:${info.color}">${info.n}자</b> · 목표 ${info.b.softMin}-${info.b.softMax} · 상한 ${info.b.hardMax} · ${info.state}</div>
      <pre class="promptbox">${escHtml(text)}</pre>
      <div style="display:flex;gap:8px;">
        <button class="smallbtn primary" onclick="copyPrompt()">복사</button>
        <button class="smallbtn" onclick="downloadPrompt()">다운로드(.txt)</button>
      </div>`;
  }
  const items = validate();
  return items.map(it=>{
    const icon = it.ok===true ? `<span style="color:var(--good)">●</span>` : it.ok===false ? `<span style="color:var(--accent)">●</span>` : `<span style="color:var(--accent2)">▲</span>`;
    return `<div class="vitem"><span class="ic">${icon}</span><span>${it.text}</span></div>`;
  }).join("") || `<div class="emptynote">모드를 선택하면 검증 항목이 나타납니다.</div>`;
}
function syncDrawerTabs(){
  document.getElementById("dtab-preview").classList.toggle("active", S.drawerTab==="preview");
  document.getElementById("dtab-validate").classList.toggle("active", S.drawerTab==="validate");
  document.getElementById("drawertitle").textContent = S.drawerTab==="preview" ? "프롬프트 미리보기" : "검증 체크리스트";
}
function openDrawer(tab){
  S.drawerTab = tab; S.drawerOpen = true;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("drawer").classList.add("open");
  syncDrawerTabs();
  document.getElementById("drawerbody").innerHTML = renderDrawerBody();
}
function closeDrawer(){
  S.drawerOpen = false;
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
}
function setDrawerTab(tab){
  S.drawerTab = tab; syncDrawerTabs();
  document.getElementById("drawerbody").innerHTML = renderDrawerBody();
}
function updateMeter(){
  const el = document.getElementById("meter");
  if(el){
    const info = budgetInfo();
    el.innerHTML = `<b style="color:${info.color}">${info.n}자</b> · 목표 ${info.b.softMin}-${info.b.softMax} · ${info.state}`;
  }
  if(S.drawerOpen){
    const db = document.getElementById("drawerbody");
    if(db) db.innerHTML = renderDrawerBody();
  }
  scheduleSave();
}
function copyPrompt(){
  const text = assemble();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast("복사됨")).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); toast("복사됨");
}
function toast(msg){
  const b = document.getElementById("drawertitle");
  if(b){ const old=b.textContent; b.textContent=msg; setTimeout(()=>{ b.textContent=old; },900); }
}
function downloadPrompt(){
  const text = assemble();
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "seedance-prompt.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ==================== MAIN RENDER ==================== */
function render(){
  document.getElementById("tab-builder").classList.toggle("active", S.tab==="builder");
  document.getElementById("tab-repair").classList.toggle("active", S.tab==="repair");
  document.getElementById("railwrap").style.display = S.tab==="builder" ? "" : "none";
  const main = document.getElementById("main");
  if(S.tab==="repair"){
    main.innerHTML = renderRepair();
  } else {
    document.getElementById("rail").innerHTML = renderRailItems();
    main.innerHTML = renderStep();
  }
  updateMeter();
}
render();

/* ==================== HYBRID PERSISTENCE ==================== */
const DRAFT_KEY = "slate:draft";
let _backend = null;
async function detectBackend(){
  if(_backend) return _backend;
  if(typeof window!=="undefined" && window.storage && typeof window.storage.get==="function"){
    _backend = "window";
    return _backend;
  }
  try{
    const t="__slate_probe__";
    localStorage.setItem(t,"1");
    localStorage.removeItem(t);
    _backend = "local";
  }catch(e){
    _backend = "none";
  }
  return _backend;
}
async function draftGet(){
  const backend = await detectBackend();
  if(backend==="window"){
    try{ const res = await window.storage.get(DRAFT_KEY,false); return res?res.value:null; }
    catch(e){ return null; } // 존재하지 않는 키는 예외를 던짐(문서 사양) — 초안 없음으로 취급
  }
  if(backend==="local"){
    try{ return localStorage.getItem(DRAFT_KEY); }catch(e){ return null; }
  }
  return null;
}
async function draftSet(value){
  const backend = await detectBackend();
  if(backend==="window"){
    try{ const r = await window.storage.set(DRAFT_KEY, value, false); return !!r; }catch(e){ return false; }
  }
  if(backend==="local"){
    try{ localStorage.setItem(DRAFT_KEY, value); return true; }catch(e){ return false; }
  }
  return false;
}
async function draftDelete(){
  const backend = await detectBackend();
  if(backend==="window"){ try{ await window.storage.delete(DRAFT_KEY,false); }catch(e){} }
  if(backend==="local"){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
}
let _saveTimer = null;
function scheduleSave(){
  if(!S.mode) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSave, 900);
}
async function doSave(){
  try{
    const ok = await draftSet(JSON.stringify(S));
    setSaveIndicator(ok);
  }catch(e){ setSaveIndicator(false); }
}
function setSaveIndicator(ok){
  const el = document.getElementById("saveind");
  if(!el) return;
  if(ok){ el.textContent = "초안 저장됨"; el.className = "saveind ok"; }
  else { el.textContent = "이 환경에서는 자동저장 불가"; el.className = "saveind off"; }
}
const DRAFT_FIELD_DEFAULTS = { moveId:null, clause:"", secondaryMoveId:null, secondaryClause:"", label:"", range:"", action:"" };
function mergeDraft(saved){
  const base = freshState();
  if(!saved || typeof saved!=="object") return base;
  Object.keys(base).forEach(k=>{
    if(!(k in saved)) return;
    const bv = base[k], sv = saved[k];
    if(Array.isArray(bv)){
      if(Array.isArray(sv)) base[k] = sv.map(b => Object.assign({}, DRAFT_FIELD_DEFAULTS, (b&&typeof b==="object")?b:{}));
    } else if(bv && typeof bv==="object"){
      if(sv && typeof sv==="object") base[k] = Object.assign({}, bv, sv);
    } else if(bv===null || sv===null || typeof sv===typeof bv){
      base[k] = sv;
    }
  });
  return base;
}
let _pendingDraft = null;
async function checkForDraft(){
  const raw = await draftGet();
  if(!raw) return;
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return; }
  if(!parsed || !parsed.mode) return;
  _pendingDraft = parsed;
  const bar = document.getElementById("restorebar");
  const md = MODES.find(m=>m.id===parsed.mode);
  document.getElementById("restoretext").textContent = `이전 작업이 저장되어 있습니다 (${md?md.label:parsed.mode}, ${parsed.step!=null?parsed.step+1:1}단계까지 진행).`;
  bar.classList.add("show");
}
function restoreDraft(){
  if(_pendingDraft) S = mergeDraft(_pendingDraft);
  document.getElementById("restorebar").classList.remove("show");
  _pendingDraft = null;
  render();
}
function dismissDraft(){
  document.getElementById("restorebar").classList.remove("show");
  _pendingDraft = null;
  draftDelete();
}
checkForDraft();
